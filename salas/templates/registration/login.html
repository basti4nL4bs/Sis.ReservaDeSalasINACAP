{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Reserva de Salas INACAP</title>
  <link rel="stylesheet" href="{% static 'salas/style.css' %}">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 3rem;">
    <div class="card">
      <header class="header" style="text-align: center; border-bottom: none; margin-bottom: 1rem;">
        <h1>Iniciar Sesión</h1>
        <p>Sistema de Reserva de Salas</p>
      </header>

      {% if form.errors %}
        <div class="alert alert-error">
          Usuario o contraseña incorrectos. Por favor, intenta nuevamente.
        </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Usuario</label>
          <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Ingresa tu usuario">
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="id_password">Contraseña</label>
          <input type="password" name="password" required id="id_password" class="form-control" placeholder="••••••••">
        </div>

        <input type="hidden" name="next" value="{{ next|default:'/mis-reservas/' }}">

        <button type="submit" class="btn" style="width: 100%; margin-top: 1.5rem; padding: 0.75rem;">Ingresar</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{% url 'salas:index' %}" class="card-meta" style="text-decoration: underline;">Volver al catálogo de salas</a>
      </div>
    </div>
  </div>
</body>
</html>
